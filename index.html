<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <p class="memory"></p>
        <p class="para"></p>
        <input type="text" inputmode="numeric" pattern="[0-9]*" id="input">
        
        <div class="box">
            <button class="btn" id="operate">C</button>
            <button class="btn" id="operate">Power</button>
            <button class="btn" id="operate">squart</button>
            <button class="btn" id="operate">*</button>
            <button class="btn" id="number">7</button>
            <button class="btn" id="number">8</button>
            <button class="btn" id="number">9</button>
            <button class="btn" id="operate">/</button>
            <button class="btn" id="number">4</button>
            <button class="btn" id="number">5</button>
            <button class="btn" id="number">6</button>
            <button class="btn" id="operate">-</button>
            <button class="btn" id="number">1</button>
            <button class="btn" id="number">2</button>
            <button class="btn" id="number">3</button>
            <button class="btn" id="operate">+</button>
            <button class="btn" id="number-type">+/-</button>
            <button class="btn" id="number">0</button>
            <button class="btn" id="dot">.</button>
            <button class="btn" id="operate">=</button>
        </div>
    </div>
</body>
</html>
